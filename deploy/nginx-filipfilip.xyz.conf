# Raspberry Pi: /etc/nginx/sites-available/filipfilip.xyz
# Enable: sudo ln -sf /etc/nginx/sites-available/filipfilip.xyz /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name filipfilip.xyz www.filipfilip.xyz;

    root /var/www/filipfilip;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
